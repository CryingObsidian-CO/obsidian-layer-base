name: Release

# Only a version tag releases, and only one shaped like a version: a stray tag should
# not produce a download page.
on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Version tag to release, for example 0.1.0'
                required: true

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        name: Build and draft a release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  # On a tag push this is the tag; started by hand, it is the tag typed in.
                  ref: ${{ inputs.tag || github.ref }}

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'

            # The tag has to name a commit that is already on master, so a release can
            # never be cut from work that was never merged. The commit checked is the
            # one this job checked out: started by hand, `GITHUB_SHA` is the head of
            # the branch the run was started from, not the commit the tag names.
            - name: The tag is on master
              env:
                  TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  git fetch --quiet origin master
                  HEAD_SHA=$(git rev-parse HEAD)
                  if git merge-base --is-ancestor "$HEAD_SHA" origin/master; then
                    echo "Tag $TAG is at $HEAD_SHA, which is on master."
                  else
                    echo "::error::Tag $TAG is at $HEAD_SHA, which is not on master. Merge it into master and tag there."
                    exit 1
                  fi

            - name: Install
              run: npm ci

            # Nothing is published from a tree that does not pass its own gate.
            - name: Tests
              run: npm test

            - name: Bundle the plugin
              run: npm run build

            - name: Bundle the MCP server
              run: npm run build:mcp

            # Compares the tag with manifest.json, which Obsidian also checks.
            - name: The tag matches the manifest
              env:
                  EXPECTED_TAG: ${{ inputs.tag || github.ref_name }}
              run: npm run check:version

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css
                      mcp-server.cjs

            - name: Create the draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  gh release create "$TAG" \
                    --title="$TAG" \
                    --draft \
                    --generate-notes \
                    main.js manifest.json styles.css mcp-server.cjs
